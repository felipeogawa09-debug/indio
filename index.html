<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f9f9f7" />
<meta name="description" content="Assine conteúdo exclusivo com pagamento por PIX. Acesso imediato após a confirmação do pagamento." />
<title>Privacy | Checkout Kauan Aruã</title>
<link rel="icon" href="https://media.base44.com/images/public/6aee158aed9deb22110b5a0c/e47f4b841_logo.png/v1/fit/w_180,h_180/e47f4b841_logo.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Instrument+Serif:ital@0;1&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1a1a;
    --ivory: #f9f9f7;
    --sand: #f2e9de;
    --stone: #e8e8e1;
    --brand: #ff4d00;
    --peach: #f9a86a;
    --peach-soft: #ffd8b3;
    --peach-deep: #ffab80;
    --peach-wash: #ffe5de;
    --head: 'Instrument Serif', ui-serif, Georgia, serif;
    --body: 'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --shadow: 0 1px 2px rgba(26,26,26,.04), 0 12px 32px -18px rgba(26,26,26,.2);
  }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { background: var(--ivory); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img { display: block; max-width: 100%; }
  button { font-family: inherit; }
  a { color: inherit; }

  /* ---------- estrutura ---------- */
  .wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 0 16px; }
  .page { width: 100%; max-width: 520px; margin: 0 auto; padding: 24px 16px 72px; }
  .card { background: #fff; border: 1px solid rgba(232,232,225,.9); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  .page-title { font-family: var(--head); font-size: 28px; line-height: 1.15; letter-spacing: -.01em; color: var(--ink); }
  .page-sub { margin-top: 4px; font-size: 13px; color: rgba(26,26,26,.5); }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .center { text-align: center; }
  .muted { color: rgba(26,26,26,.5); }

  /* ---------- barra superior ---------- */
  .bar { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); }
  .bar-in { position: relative; display: flex; align-items: center; justify-content: center; height: 56px; max-width: 600px; margin: 0 auto; padding: 0 16px; }
  .logo { position: relative; display: block; overflow: hidden; }
  .bar-right { position: absolute; right: 16px; top: 0; bottom: 0; display: flex; align-items: center; gap: 6px; }
  .link-back { display: flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; font-size: 12px; font-weight: 500; color: rgba(26,26,26,.55); text-decoration: none; }
  .link-back:hover { color: var(--ink); }

  /* ---------- idioma ---------- */
  .lang { position: relative; }
  .lang-btn { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(26,26,26,.12); background: #fff; font-size: 11.5px; font-weight: 600; color: rgba(26,26,26,.7); cursor: pointer; }
  .lang-menu { position: absolute; right: 0; top: 36px; min-width: 150px; padding: 4px; background: #fff; border: 1px solid var(--stone); border-radius: 12px; box-shadow: 0 12px 32px -18px rgba(26,26,26,.25); display: none; z-index: 50; }
  .lang-menu.open { display: block; }
  .lang-item { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .lang-item:hover { background: var(--sand); }

  /* ---------- perfil ---------- */
  .banner { margin: 0 -16px; overflow: hidden; background: var(--stone); }
  .banner .ratio { width: 100%; aspect-ratio: 4 / 3; }
  .banner img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  @media (min-width: 640px) { .banner .ratio { aspect-ratio: 16 / 7; } }
  .head { margin-top: -40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px; }
  .avatar { width: 84px; height: 84px; flex: 0 0 auto; border-radius: 50%; overflow: hidden; background: var(--stone); box-shadow: 0 0 0 4px #fff; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  @media (min-width: 640px) { .head { margin-top: -52px; } .avatar { width: 104px; height: 104px; } }
  .stats { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: rgba(26,26,26,.8); font-variant-numeric: tabular-nums; }
  .stat svg { color: rgba(26,26,26,.55); }
  .name { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 21px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; color: #000; }
  .badge-v { display: flex; align-items: center; justify-content: center; width: 17px; height: 17px; flex: 0 0 auto; border-radius: 50%; background: var(--peach); }
  .handle { margin-top: 2px; font-size: 13px; color: rgba(0,0,0,.4); }
  .bio { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.55; color: rgba(0,0,0,.75); white-space: pre-line; }
  .bio.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: 4px; border: 0; background: none; font-size: 13px; font-weight: 500; color: var(--peach); cursor: pointer; }

  /* ---------- planos ---------- */
  .plans { margin-top: 32px; }
  .section-title { font-size: 17px; font-weight: 600; color: #000; }
  .plan-pill { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 54px; margin-top: 12px; padding: 0 20px; border: 0; border-radius: 999px; background: linear-gradient(90deg, var(--peach-soft), var(--peach-deep)); text-align: left; cursor: pointer; transition: transform .1s; }
  .plan-pill:active { transform: scale(.985); }
  .plan-name { font-size: 15px; font-weight: 500; color: rgba(0,0,0,.9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-price { font-size: 15px; font-weight: 600; color: #000; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .promos { margin-top: 24px; }
  .promos-head { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 4px 0; border: 0; background: none; cursor: pointer; }
  .promos-head .chev { color: rgba(0,0,0,.6); transition: transform .2s; }
  .promos.closed .chev { transform: rotate(180deg); }
  .promos-body { display: grid; gap: 10px; overflow: hidden; max-height: 640px; margin-top: 10px; transition: max-height .3s ease, opacity .25s ease, margin-top .3s ease; opacity: 1; }
  .promos.closed .promos-body { max-height: 0; margin-top: 0; opacity: 0; }
  .empty-plans { margin-top: 12px; padding: 24px 16px; border: 1px dashed rgba(0,0,0,.15); border-radius: 999px; text-align: center; font-size: 13px; color: rgba(0,0,0,.5); }

  /* ---------- abas ---------- */
  .tabs-wrap { margin-top: 36px; }
  .tabs { display: flex; gap: 4px; padding: 0 4px; background: rgba(242,233,222,.8); border-radius: 18px 18px 0 0; }
  .tab { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 8px 12px; border: 0; background: none; font-size: 13px; font-weight: 500; color: rgba(26,26,26,.55); cursor: pointer; transition: color .2s; }
  .tab.active { color: #e8a066; }
  .tab.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 999px; background: var(--peach-deep); }
  .tab b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .tab-body { margin-top: 16px; }

  /* ---------- post ---------- */
  .post { margin-bottom: 12px; }
  .post-head { display: flex; align-items: center; gap: 10px; }
  .post-avatar { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; overflow: hidden; background: var(--sand); }
  .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .post-user { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .post-handle { font-size: 11.5px; color: rgba(26,26,26,.45); }
  .menu-wrap { position: relative; margin-left: auto; }
  .menu-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: rgba(26,26,26,.45); cursor: pointer; }
  .menu-btn:hover { background: rgba(26,26,26,.04); color: var(--ink); }
  .menu { position: absolute; right: 0; top: 36px; z-index: 20; min-width: 220px; padding: 4px; background: #fff; border: 1px solid var(--stone); border-radius: 12px; box-shadow: 0 12px 32px -18px rgba(26,26,26,.3); display: none; }
  .menu.open { display: block; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .menu-item:hover { background: var(--sand); }

  .locked { position: relative; margin-top: 12px; border-radius: 12px; overflow: hidden; background: var(--sand); }
  .locked-ratio { position: relative; width: 100%; aspect-ratio: 4 / 5; }
  @media (min-width: 640px) { .locked-ratio { aspect-ratio: 4 / 3; } }
  .locked-ratio img { width: 100%; height: 100%; object-fit: cover; filter: blur(4px); transform: scale(1.05); }
  .locked-veil { position: absolute; inset: 0; background: rgba(242,233,222,.72); }
  .locked-body { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px; }
  .lock-circle { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: rgba(26,26,26,.85); box-shadow: 0 10px 15px -3px rgba(0,0,0,.25); }
  .locked-text { max-width: 24ch; text-align: center; font-size: 11.5px; font-weight: 500; line-height: 1.35; color: rgba(26,26,26,.55); }
  .locked-meta { display: flex; align-items: center; gap: 16px; font-size: 12px; font-weight: 500; color: rgba(26,26,26,.55); }
  .locked-meta span { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .caption { margin-top: 12px; font-size: 13.5px; font-weight: 700; line-height: 1.6; color: rgba(26,26,26,.8); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- combo ---------- */
  .combo { margin-top: 12px; padding: 16px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; background: #151515; }
  .combo h3 { font-size: 15px; font-weight: 700; color: #fff; }
  .combo .sub { margin-top: 4px; font-size: 12.5px; line-height: 1.3; color: rgba(255,255,255,.55); }
  .combo ul { list-style: none; margin-top: 14px; display: grid; gap: 8px; }
  .combo li { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.3; color: rgba(255,255,255,.9); }
  .tick { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px; border-radius: 5px; background: #10b981; }
  .combo-btn { width: 100%; height: 48px; margin-top: 16px; border: 0; border-radius: 999px; background: #ff9933; color: #000; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* ---------- FAQ ---------- */
  .faq { margin-top: 28px; }
  .faq h2 { text-align: center; font-family: var(--head); font-size: 22px; color: var(--brand); }
  .faq-list { margin-top: 16px; display: grid; gap: 8px; }
  .faq-item { border: 1px solid var(--stone); border-radius: 12px; background: #fff; overflow: hidden; }
  .faq-item.open { border-color: rgba(26,26,26,.6); }
  .faq-q { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .faq-a { padding: 0 16px 12px; font-size: 12.5px; line-height: 1.6; color: rgba(26,26,26,.6); }

  /* ---------- mídias ---------- */
  .filters { display: flex; align-items: center; gap: 4px; }
  .filter { border: 0; border-radius: 999px; padding: 6px 12px; background: none; font-size: 13px; font-weight: 500; color: rgba(26,26,26,.8); cursor: pointer; transition: background-color .15s, color .15s; }
  .filter:hover { color: var(--ink); }
  .filter.active { background: var(--peach-wash); color: var(--brand); }
  .grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { position: relative; aspect-ratio: 1 / 1; border-radius: 16px; background: var(--sand); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .tile::before { content: ""; position: absolute; width: 66%; height: 66%; border-radius: 50%; background: rgba(255,255,255,.25); }
  .tile svg { position: relative; color: #475569; }

  /* ---------- rodapé ---------- */
  .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(0,0,0,.1); text-align: center; }
  .footer-logo { display: flex; justify-content: center; }
  .footer-links { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 11.5px; color: rgba(0,0,0,.45); }
  .footer-links a { text-decoration: none; }
  .footer-links a:hover { color: var(--ink); }
  .age { margin-top: 12px; font-size: 10.5px; color: rgba(26,26,26,.3); }

  /* ---------- barra fixa ---------- */
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding-bottom: env(safe-area-inset-bottom); transform: translateY(110%); transition: transform .3s; pointer-events: none; }
  .sticky.show { transform: none; }
  .sticky-in { max-width: 560px; margin: 0 auto; padding: 0 16px 12px; pointer-events: auto; }
  .sticky-btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 20px; border: 0; border-radius: 16px; background: var(--ink); color: var(--ivory); cursor: pointer; box-shadow: 0 20px 60px -28px rgba(26,26,26,.4); }
  .sticky-btn .l { display: flex; flex-direction: column; text-align: left; }
  .sticky-btn .l b { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
  .sticky-btn .l small { font-size: 11px; color: rgba(249,249,247,.55); }
  .sticky-btn .r { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- botões ---------- */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border: 0; border-radius: 16px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: filter .15s; }
  .btn:disabled { opacity: .7; cursor: default; }
  .btn-brand { background: var(--brand); color: #fff; box-shadow: 0 16px 36px -20px rgba(255,77,0,.9); }
  .btn-green { background: #059669; color: #fff; box-shadow: 0 20px 40px -20px rgba(5,150,105,.9); }
  .btn-ink { background: var(--ink); color: var(--ivory); }
  .btn-outline { border: 1px solid rgba(26,26,26,.12); background: #fff; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .foot-note { display: flex; align-items: flex-start; gap: 6px; margin-top: 12px; font-size: 11px; line-height: 1.6; color: rgba(26,26,26,.4); }

  /* ---------- estados ---------- */
  .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(26,26,26,.15); border-top-color: rgba(26,26,26,.6); border-radius: 50%; animation: spin 1s linear infinite; }
  .loader.light { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 32px; padding: 44px 16px; border-radius: 16px; background: rgba(255,255,255,.6); font-size: 13px; color: rgba(26,26,26,.55); }
  .alert-card { margin-top: 24px; padding: 24px; border: 1px solid var(--stone); border-radius: 16px; background: #fff; text-align: center; }
  .alert-card p { font-size: 13.5px; line-height: 1.6; color: rgba(26,26,26,.7); }
  .alert-card svg { margin: 0 auto; color: #ef4444; }
  .err { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; padding: 10px 12px; border-radius: 12px; background: #fef2f2; color: #b91c1c; font-size: 12px; line-height: 1.5; }
  .skeleton { animation: pulse 1.6s ease-in-out infinite; background: var(--stone); border-radius: 12px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ---------- pagamento ---------- */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .pill.wait { background: #fef3c7; color: #b45309; }
  .pill.paid { background: #d1fae5; color: #047857; }
  .pill.fail { background: #fee2e2; color: #b91c1c; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; animation: pulse 1.6s ease-in-out infinite; }
  .summary { margin-top: 24px; padding: 16px; border: 1px solid rgba(232,232,225,.9); border-radius: 16px; background: #fff; box-shadow: var(--shadow); }
  .summary .label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(26,26,26,.45); }
  .summary .plan { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .summary .desc { margin-top: 2px; font-size: 12px; color: rgba(26,26,26,.5); }
  .summary .price { font-size: 17px; font-weight: 600; color: var(--brand); font-variant-numeric: tabular-nums; }
  .summary .seal { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(232,232,225,.7); font-size: 11px; color: rgba(26,26,26,.45); }
  .pix-card { margin-top: 20px; padding: 16px; border: 1px solid rgba(232,232,225,.9); border-radius: 16px; background: #fff; box-shadow: var(--shadow); }
  .pix-qr { max-width: 260px; margin: 0 auto; padding: 8px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .pix-qr img { width: 100%; max-width: 240px; height: auto; border-radius: 8px; }
  .pix-qr .no-qr { display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; width: 100%; padding: 0 16px; border-radius: 8px; background: rgba(232,232,225,.5); text-align: center; font-size: 11.5px; color: rgba(26,26,26,.5); }
  .pix-hint { margin-top: 16px; text-align: center; font-size: 11.5px; color: rgba(26,26,26,.45); }
  .pix-code { margin-top: 12px; padding: 10px; border: 1px solid var(--stone); border-radius: 12px; background: rgba(242,242,242,.7); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; line-height: 1.6; color: rgba(26,26,26,.55); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .copy-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--ink); color: var(--ivory); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .copy-btn:disabled { opacity: .5; }
  .auto-check { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; font-size: 11.5px; color: rgba(26,26,26,.45); }
  .success-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: #d1fae5; color: #059669; }
  .code-box { margin-top: 8px; padding: 10px; border-radius: 10px; background: rgba(242,242,242,.8); font-family: ui-monospace, monospace; font-size: 10.5px; color: rgba(26,26,26,.6); word-break: break-all; }
  .text-btn { display: flex; align-items: center; gap: 6px; margin-top: 10px; border: 0; background: none; font-size: 11.5px; font-weight: 500; color: rgba(26,26,26,.6); cursor: pointer; }
  .text-btn:hover { color: var(--ink); }

  /* ---------- funil ---------- */
  .attention { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid rgba(232,232,225,.7); background: rgba(249,249,247,.95); backdrop-filter: blur(8px); }
  .attention-in { display: flex; justify-content: center; max-width: 520px; margin: 0 auto; padding: 12px 16px; }
  .attention-icon { position: relative; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; }
  .attention-icon .ping { position: absolute; inset: 0; border-radius: 50%; background: rgba(254,202,202,.7); animation: ping 1.4s cubic-bezier(0,0,.2,1) infinite; }
  .attention-icon .core { position: relative; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: #fef2f2; box-shadow: 0 0 0 4px #fecaca; font-size: 32px; line-height: 1; }
  @keyframes ping { 0% { transform: scale(1); opacity: .75; } 75%,100% { transform: scale(1.5); opacity: 0; } }
  .funnel-article { padding: 20px; border: 1px solid rgba(232,232,225,.9); border-radius: 16px; background: #fff; box-shadow: var(--shadow); }
  .funnel-article p { margin-top: 12px; font-size: 14px; line-height: 1.7; color: rgba(26,26,26,.75); white-space: pre-line; }

    }
    return fetch(url.toString(), { headers: HEADERS, cache: "no-store" }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var msg = (data && (data.message || data.error)) || "Falha ao carregar dados.";
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  function callFn(name, body) {

  }

    var list = h("div");
    posts.forEach(function (post) {
      list.appendChild(postCard(post, profile, comboPlan));
    });
    return list;
  }

  function postCard(post, profile, comboPlan) {
    var menu = h("div", { class: "menu" });
    var copyLabel = h("span", null, t("copyLink"));
    var menuBtn = h("button", {
      class: "menu-btn", type: "button", "aria-label": "Mais opções",
      onClick: function (event) {
        event.stopPropagation();
        menu.classList.toggle("open");
      }
    }, icon("more", 17, 1.8));

    menu.appendChild(h("button", {
      class: "menu-item", type: "button",
      onClick: function () {
        var link = location.origin + location.pathname + "#/?post=" + post.id;
        var done = function () {
          copyLabel.textContent = t("linkCopied");
          setTimeout(function () { copyLabel.textContent = t("copyLink"); }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(done, done);
        } else {
          var area = document.createElement("textarea");
          area.value = link;
          document.body.appendChild(area);
          area.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(area);
          done();
        }
      }
    }, icon("link", 15), copyLabel));

    menu.appendChild(h("button", {
      class: "menu-item", type: "button",
      onClick: function () {
        menu.classList.remove("open");
        var plans = document.getElementById("planos");
        if (plans) plans.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }, icon("sparkles", 15), t("seePlans")));

    document.addEventListener("click", function () { menu.classList.remove("open"); }, { once: true });

    var card = h("article", { class: "card post" },
      h("header", { class: "post-head" },
        h("div", { class: "post-avatar" }, profile.avatar_url ? h("img", { src: profile.avatar_url, alt: "" }) : null),
        h("div", null,
          h("div", { class: "post-user" },
            h("span", null, profile.display_name),
            profile.verified ? icon("checkCircle", 13, 2) : null
          ),
          h("div", { class: "post-handle" }, "@" + (profile.username || ""))
        ),
        h("div", { class: "menu-wrap" }, menuBtn, menu)
      ),
      lockedMedia(post),
      post.caption ? h("p", { class: "caption" }, post.caption) : null
    );

    if (post.caption && post.caption.indexOf(COMBO_TRIGGER) >= 0) {
      card.appendChild(comboCard(comboPlan));
      card.appendChild(faqSection());
    }
    return card;
  }

  function lockedMedia(post) {
    return h("div", { class: "locked" },
      h("div", { class: "locked-ratio" },
        post.preview_url ? h("img", { src: post.preview_url, alt: "", "aria-hidden": "true", loading: "lazy" }) : null,
        h("div", { class: "locked-veil" }),
        h("div", { class: "locked-body" },
          h("div", { class: "lock-circle" }, icon("lock", 20, 2.2)),
          h("p", { class: "locked-text" }, t("lockedContent")),
          h("div", { class: "locked-meta" },
            post.photos_count ? h("span", null, icon("image", 14), compactNumber(post.photos_count)) : null,
            post.videos_count ? h("span", null, icon("video", 14), compactNumber(post.videos_count)) : null,
            h("span", null, icon("heart", 14), compactNumber(post.likes_count))
          )
        )
      )
    );
  }

  function comboCard(comboPlan) {
    var price = brl(comboPlan ? comboPlan.price : 49.9);
    return h("div", { class: "combo" },
      h("h3", null, "🔥 Super Combo Exclusivo"),
      h("p", { class: "sub" }, "Tudo o que tenho a oferecer em um único pacote"),
      h("ul", null, COMBO_ITEMS.map(function (item) {
        return h("li", null, h("span", { class: "tick" }, icon("check", 11, 3.6)), h("span", null, item));
      })),
      h("button", {
        class: "combo-btn", type: "button",
        onClick: function () {
          if (comboPlan) go("/checkout?plano=" + encodeURIComponent(comboPlan.id));
          else {
            var plans = document.getElementById("planos");
            if (plans) plans.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }
      }, "🔥 Super Combo Exclusivo " + price)
    );
  }

  function faqSection() {
    var open = null;
    var list = h("div", { class: "faq-list" });

    FAQS.forEach(function (item, index) {
      var answer = h("p", { class: "faq-a hidden" }, item.a);
      var wrap = h("div", { class: "faq-item" });
      var button = h("button", {
        class: "faq-q", type: "button", "aria-expanded": "false",
        onClick: function () {
          var isOpen = open === index;
          open = isOpen ? null : index;
          Array.prototype.forEach.call(list.children, function (child, i) {
            var isCurrent = i === index;
            var shouldOpen = isCurrent && open === index;
            child.classList.toggle("open", shouldOpen);
            child.querySelector(".faq-a").classList.toggle("hidden", !shouldOpen);
            child.querySelector(".faq-q").setAttribute("aria-expanded", shouldOpen ? "true" : "false");
            var slot = child.querySelector(".faq-icon");
            slot.replaceChildren(icon(shouldOpen ? "minus" : "plus", 16, 2.2));
          });
        }
      }, h("span", null, item.q), h("span", { class: "faq-icon", style: { display: "flex", color: "var(--brand)" } }, icon("plus", 16, 2.2)));
      wrap.append(button, answer);
      list.appendChild(wrap);
    });

    return h("section", { class: "faq" }, h("h2", null, "Perguntas Frequentes"), list);
  }

  function mediaGrid(state, repaint) {
    var items = store.posts.map(function (post) {
      return { id: post.id, type: post.type, locked: true };
    });

    var filtered = items.filter(function (item) {
      if (state.filter === "all") return true;
      if (state.filter === "paid") return item.locked;
      return item.type === state.filter;
    });

    var tiles = filtered.slice();
    while (tiles.length < 6) tiles.push({ id: "ph-" + tiles.length, type: null, locked: true });

    var filters = [
      { key: "all", label: t("all") },
      { key: "photo", label: t("photos") },
      { key: "video", label: t("videos") },
      { key: "paid", label: t("paidFilter") }
    ];

    return h("div", { class: "card" },
      h("div", { class: "filters", role: "group" },
        filters.map(function (option) {
          return h("button", {
            class: "filter" + (state.filter === option.key ? " active" : ""),
            type: "button",
            onClick: function () { state.filter = option.key; repaint(); }
          }, option.label);
        })
      ),
      h("div", { class: "grid" }, tiles.map(function () {
        return h("div", { class: "tile" }, icon("lock", 20, 1.6));
      }))
    );
  }

  function footer() {
    return h("footer", { class: "footer" },
      h("div", { class: "footer-logo" }, logo(16)),
      h("div", { class: "footer-links" },
        h("a", { href: LIVE + "/termos", target: "_blank", rel: "noreferrer" }, t("terms")),
        h("span", { "aria-hidden": "true" }, "•"),
        h("a", { href: LIVE + "/privacidade", target: "_blank", rel: "noreferrer" }, t("privacy"))
      ),
      h("p", { class: "age" }, t("ageNotice"))
    );
  }

  function stickySubscribe(plan) {
    if (!plan) return null;
    var bar = h("div", { class: "sticky" },
      h("div", { class: "sticky-in" },
        h("button", {
          class: "sticky-btn", type: "button",
          onClick: function () { go("/checkout?plano=" + encodeURIComponent(plan.id)); }
        },
          h("span", { class: "l" },
            h("b", null, t("subscribe") + " " + plan.name),
            h("small", null, t("instantAccess"))
          ),
          h("span", { class: "r" }, brl(plan.price), icon("arrowRight", 16))
        )
      )
    );
    if (stickyHandler) window.removeEventListener("scroll", stickyHandler);
    stickyHandler = function () { bar.classList.toggle("show", window.scrollY > 520); };
    window.addEventListener("scroll", stickyHandler, { passive: true });
    setTimeout(stickyHandler, 0);
    return bar;
  }

  /* ============================================================
     CHECKOUT — cria o PIX no servidor
     ============================================================ */
  function orderSummary(plan) {
    var months = Number(plan.duration_months || 1);
    var desc = months === 1 ? "Acesso por 1 mês" : months >= 100 ? "Acesso vitalício" : "Acesso por " + months + " meses";
    if (Number(plan.discount_percent) > 0) desc += " · " + plan.discount_percent + "% off";

    return h("div", { class: "summary" },
      h("div", { class: "row-between", style: { alignItems: "flex-start" } },
        h("div", null,
          h("p", { class: "label" }, "Seu pedido"),
          h("p", { class: "plan" }, "Assinatura " + plan.name),
          h("p", { class: "desc" }, desc)
        ),
        h("p", { class: "price" }, brl(plan.price))
      ),
      h("div", { class: "seal" }, icon("shield", 14), "Acesso liberado automaticamente após a confirmação do PIX.")
    );
  }

  function renderCheckout(params) {
    var planId = params.get("plano");
    var demo = params.get("demo") === "1";
    var body = h("main", { class: "page" });

    mount(brandbar(backLink()), body);
    body.append(
      h("h1", { class: "page-title" }, "Pagamento por PIX"),
      h("p", { class: "page-sub" }, "Geramos o QR Code automaticamente. Não é preciso preencher cadastro.")
    );

    var slot = h("div");
    body.appendChild(slot);

    function unavailable() {
      slot.replaceChildren(h("div", { class: "alert-card" },
        h("p", null, "Este plano não está mais disponível."),
        h("button", { class: "btn btn-ink", style: { marginTop: "16px", height: "44px", textTransform: "none", letterSpacing: "0" }, onClick: function () { go("/"); } }, "Escolher outro plano")
      ));
    }

    if (!planId) { unavailable(); return; }

    slot.appendChild(loaderBox("Gerando cobrança PIX…"));

    apiGet("/entities/SubscriptionPlan/" + encodeURIComponent(planId)).then(function (plan) {
      if (!plan || plan.active === false) { unavailable(); return; }
      slot.replaceChildren(orderSummary(plan), h("div", { style: { marginTop: "20px" } }, loaderBox("Gerando cobrança PIX…")));

      return callFn(demo ? "createDemoOrder" : "createPixCharge", { plan_id: planId }).then(function (data) {
        if (!data.order) throw new Error(data.error || "Não foi possível gerar a cobrança.");
        lsSet("orla:token", data.access_token || "");
        goWithToken("/pagamento/" + data.order.order_code, data.access_token || "");
      });
    }).catch(function (error) {
      slot.replaceChildren(
        h("div", { class: "err" }, icon("alert", 15), h("span", null, error.message || "Não foi possível gerar a cobrança PIX.")),
        h("button", { class: "btn btn-brand", style: { marginTop: "16px" }, onClick: function () { renderCheckout(params); } }, "Gerar PIX novamente"),
        h("p", { class: "foot-note" }, icon("lock", 13), "O valor é conferido no servidor, direto no plano cadastrado, antes de gerar o PIX.")
      );
    });
  }

  /* ============================================================
     PAGAMENTO — consulta o status no servidor
     ============================================================ */
  function statusPill(status) {
    if (status === "paid") return h("span", { class: "pill paid" }, icon("checkCircle", 13, 2), "Pago");
    if (status === "failed" || status === "expired") return h("span", { class: "pill fail" }, icon("alert", 13, 2), status === "expired" ? "Expirado" : "Falhou");
    return h("span", { class: "pill wait" }, h("span", { class: "dot" }), "Aguardando pagamento");
  }

  function pixCard(qr, code) {
    var copyLabel = h("span", null, "Copiar PIX");

    function copy() {
      if (!code) return;
      var done = function () {
        copyLabel.textContent = "Código copiado";
        setTimeout(function () { copyLabel.textContent = "Copiar PIX"; }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, done);
      } else {
        var area = document.createElement("textarea");
        area.value = code;
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(area);
        done();
      }
    }

    return h("div", { class: "pix-card" },
      h("div", { class: "pix-qr" },
        qr ? h("img", { src: qr, alt: "QR Code PIX" })
           : h("div", { class: "no-qr" }, "Use o código copia e cola abaixo no app do seu banco.")
      ),
      h("p", { class: "pix-hint" }, "Abra o app do banco, escolha PIX → Ler QR Code."),
      h("div", { class: "pix-code" }, code || "Código PIX indisponível"),
      h("button", { class: "copy-btn", type: "button", onClick: copy, disabled: code ? null : true }, icon("copy", 15, 2), copyLabel)
    );
  }

  function renderPayment(orderCode, params) {
    var token = params.get("t") || lsGet("orla:token");
    var body = h("main", { class: "page" });
    mount(brandbar(h("a", { class: "link-back", href: "#/" }, t("home"))), body);

    var title = h("h1", { class: "page-title" }, "Pagamento via PIX");
    var pillSlot = h("div");
    body.append(
      h("div", { class: "row-between" }, title, pillSlot),
      h("p", { class: "page-sub" }, "Pedido " + orderCode)
    );

    var slot = h("div");
    body.appendChild(slot);

    if (!token) {
      slot.appendChild(errorCard("Código de acesso ausente. Abra o link completo do pedido."));
      return;
    }

    slot.appendChild(loaderBox("Carregando cobrança…"));

    var paidHandled = false;

    function startFunnel() {
      return callFn("funnelStart", { access_token: token }).then(function (data) {
        if (data.token && data.redirect) {
          lsSet("orla:funnel", data.token);
          goWithToken(data.redirect, data.token);
        }
      }).catch(function () { /* o botão permite tentar de novo */ });
    }

    function paint(data) {
      pillSlot.replaceChildren(statusPill(data.status));

      if (data.status === "paid") {
        title.textContent = "Pagamento aprovado";
        var advance = function () {
          token && startFunnel();
        };
        slot.replaceChildren(
          h("div", { class: "card center", style: { marginTop: "24px", padding: "24px" } },
            h("div", { class: "success-icon" }, icon("checkCircle", 28, 2)),
            h("h2", { style: { marginTop: "16px", fontFamily: "var(--head)", fontSize: "24px" } }, "PAGAMENTO APROVADO"),
            h("p", { style: { marginTop: "4px", fontSize: "13px", color: "rgba(26,26,26,.6)" } },
              "Assinatura " + ((data.subscription && data.subscription.plan_name) || (data.order && data.order.plan_name) || "") +
              " ativa até " + formatDate(data.subscription && data.subscription.expires_at) + "."),
            h("button", {
              class: "btn btn-green", style: { marginTop: "20px", height: "48px", fontSize: "13px" },
              onClick: advance
            }, "Liberando seu acesso…")
          ),
          h("div", { class: "pix-card" },
            h("p", { class: "label", style: { fontSize: "11px", fontWeight: "600", letterSpacing: ".14em", textTransform: "uppercase", color: "rgba(26,26,26,.45)" } }, "Código de acesso"),
            h("div", { class: "code-box" }, token),
            h("button", {
              class: "text-btn", type: "button",
              onClick: function () {
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(token);
              }
            }, icon("copy", 13), "Copiar para usar em outro aparelho")
          )
        );
        if (!paidHandled) { paidHandled = true; startFunnel(); }
        return;
      }

      slot.replaceChildren(
        data.order ? orderSummary({
          name: data.order.plan_name,
          price: data.order.amount,
          duration_months: data.order.duration_months
        }) : null,
        pixCard(data.qr, data.order ? data.order.pix_code : ""),
        h("div", { class: "auto-check" }, h("span", { class: "loader", style: { width: "14px", height: "14px" } }), "Verificamos seu pagamento automaticamente."),
        h("button", {
          class: "btn btn-outline", style: { marginTop: "16px", height: "44px", fontSize: "12.5px" },
          onClick: function () { refresh(); }
        }, "Já paguei, atualizar")
      );
    }

    function refresh() {
      return callFn("checkPixStatus", { order_code: orderCode, access_token: token })
        .then(function (data) {
          if (data.error) throw new Error(data.error);
          paint(data);
          return data;
        })
        .catch(function (error) {
          slot.replaceChildren(errorCard(error.message || "Falha ao consultar o pagamento.", h("button", {
            class: "btn btn-ink", style: { marginTop: "16px", height: "44px", textTransform: "none", letterSpacing: "0" },
            onClick: function () { refresh(); }
          }, "Tentar novamente")));
          return null;
        });
    }

    refresh().then(function (data) {
      if (data && data.status === "pending") {
        every(8000, function () {
          callFn("checkPixStatus", { order_code: orderCode, access_token: token })
            .then(function (next) { if (next.status !== "pending") paint(next); })
            .catch(function () {});
        });
      }
    });
  }

  /* ============================================================
     FUNIL — etapas de liberação
     ============================================================ */
  function attentionBar() {
    return h("div", { class: "attention" },
      h("div", { class: "attention-in" },
        h("div", { class: "attention-icon" },
          h("span", { class: "ping" }),
          h("span", { class: "core" }, "⚠️")
        )
      )
    );
  }

  function renderFunnelStep(step, params) {
    var token = params.get("t") || lsGet("orla:funnel");
    if (token) lsSet("orla:funnel", token);

    var body = h("main", { class: "page", style: { paddingTop: "16px" } });
    mount(attentionBar(), body);

    if (!token) {
      body.appendChild(errorCard("Acesso não identificado. Abra o link da sua liberação."));
      return;
    }

    var slot = h("div");
    body.appendChild(slot);
    slot.appendChild(loaderBox("Carregando…"));

    function goToken(path) { goWithToken(path, token); }

    function poll() {
      every(6000, function () {
        callFn("funnelStatus", { token: token, step: step }).then(function (data) {
          if (data.redirect) goToken(data.redirect);
          else if (data.expired) renderFunnelStep(step, params);
        }).catch(function () {});
      });
    }

    callFn("funnelStep", { token: token, step: step }).then(function (data) {
      if (data.redirect) { goToken(data.redirect); return; }

      var article = h("article", { class: "funnel-article" },
        (data.blocks || []).map(function (block) { return h("p", null, block); })
      );
      slot.replaceChildren(article);

      if (data.charge) {
        var card = pixCard(data.charge.qr, data.charge.pix_code);
        slot.append(card, h("div", { class: "auto-check" }, h("span", { class: "loader", style: { width: "14px", height: "14px" } }), "Verificamos seu pagamento automaticamente."));
        poll();
      } else {
        var payBtn = h("button", {
          class: "btn btn-green", style: { marginTop: "24px", minHeight: "68px", padding: "0 16px" },
          onClick: function () {
            payBtn.disabled = true;
            payBtn.replaceChildren(h("span", { class: "loader light" }), "Gerando PIX…");
            callFn("funnelPay", { token: token, step: step }).then(function (charge) {
              if (charge.redirect) { goToken(charge.redirect); return; }
              if (!charge.pix_code) throw new Error("O gateway não retornou o código PIX. Tente novamente.");
              var card2 = pixCard(charge.qr, charge.pix_code);
              slot.replaceChildren(article, card2,
                h("div", { class: "auto-check" }, h("span", { class: "loader", style: { width: "14px", height: "14px" } }), "Verificamos seu pagamento automaticamente."));
              poll();
            }).catch(function (error) {
              payBtn.disabled = false;
              payBtn.textContent = data.button || "Pagar";
              slot.appendChild(h("div", { class: "err" }, icon("alert", 15), h("span", null, error.message || "Não foi possível gerar o PIX desta etapa.")));
            });
          }
        }, data.button || "Pagar");
        slot.appendChild(payBtn);
      }

      if (data.demo) {
        slot.appendChild(h("div", { class: "demo-box" },
          h("p", { class: "tag" }, "Modo de teste"),
          h("button", {
            class: "btn btn-ink", onClick: function () {
              callFn("funnelDemoApprove", { token: token, step: step }).then(function (result) {
                if (result.redirect) goToken(result.redirect);
              }).catch(function (error) {
                slot.appendChild(h("div", { class: "err" }, icon("alert", 15), h("span", null, error.message)));
              });
            }
          }, "Simular pagamento aprovado")
        ));
      }
    }).catch(function (error) {
      slot.replaceChildren(errorCard(error.message || "Não foi possível abrir esta etapa.", h("button", {
        class: "btn btn-ink", style: { marginTop: "16px", height: "44px", textTransform: "none", letterSpacing: "0" },
        onClick: function () { goToken("/taxa-1"); }
      }, "Tentar novamente")));
    });
  }

  /* ============================================================
     FINAL — links dos grupos
     ============================================================ */
  function renderFunnelFinal(params) {
    var token = params.get("t") || lsGet("orla:funnel");
    if (token) lsSet("orla:funnel", token);

    var body = h("main", { class: "page", style: { paddingTop: "40px" } });
    mount(brandbar(h("a", { class: "link-back", href: "#/" }, t("home"))), body);

    if (!token) {
      body.appendChild(errorCard("Acesso não identificado."));
      return;
    }

    var slot = h("div");
    body.appendChild(slot);
    slot.appendChild(loaderBox("Liberando…"));

    callFn("funnelFinal", { token: token }).then(function (data) {
      if (data.redirect) { goWithToken(data.redirect, token); return; }
      slot.replaceChildren(
        h("div", { class: "center" },
          h("div", { class: "celebrate" }, "🎉"),
          h("h1", { class: "page-title", style: { marginTop: "20px" } }, "PARABÉNS! Você acaba de garantir seu acesso aos nossos grupos!"),
          h("p", { class: "page-sub", style: { marginTop: "12px" } }, "Escolha o seu grupo para entrar:")
        ),
        h("div", { class: "final-links" }, (data.links || []).map(function (link) {
          return h("a", { href: link.url, target: "_blank", rel: "noreferrer" }, link.label);
        }))
      );
    }).catch(function (error) {
      slot.replaceChildren(errorCard(error.message || "Não foi possível validar o acesso."));
    });
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function render() {
    var route = currentRoute();
    var path = route.path;
    var params = route.params;

    if (path === "/" || path === "") {
      renderProfile();
      return;
    }
    if (path === "/checkout") {
      renderCheckout(params);
      return;
    }
    if (path.indexOf("/pagamento/") === 0) {
      renderPayment(decodeURIComponent(path.replace("/pagamento/", "")), params);
      return;
    }
    var taxa = path.match(/^\/taxa-([1-5])$/);
    if (taxa) {
      renderFunnelStep(Number(taxa[1]), params);
      return;
    }
    if (path === "/liberado") {
      renderFunnelFinal(params);
      return;
    }
    go("/");
  }

  window.addEventListener("hashchange", render);
  document.documentElement.lang = store.lang === "pt" ? "pt-BR" : store.lang;
  render();
})();
</script>
</body>
</html>
